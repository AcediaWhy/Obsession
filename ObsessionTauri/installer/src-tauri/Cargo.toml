# Оболочка инсталлера «Obsession Setup»: medium Tauri UI и узкий native
# per-machine worker с authenticated payload; вложенный NSIS не запускается.
# ВАЖНО: имя крейта/бинаря НЕ «obsession» — setup и основное приложение
# должны оставаться разными процессами и артефактами.

[package]
name = "obsession-setup"
version = "1.1.0"
description = "Obsession Setup — фирменный инсталлер"
authors = ["AcediaWhy"]
edition = "2021"

[lib]
name = "obsession_setup_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
obsession-runtime-service = { path = "../../runtime-service" }
obsession-runtime-client = { path = "../../runtime-client" }
obsession-runtime-protocol = { path = "../../runtime-protocol" }
# Detect WebView2 before creating the setup window.
winreg = "0.55"
# Именованные Windows mutex: одно окно setup и одна install-операция за раз.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
