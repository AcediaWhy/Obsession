<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aurora — световая сцена</title>
<style>html,body{margin:0;background:#050c15;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block}aside{position:absolute;bottom:20px;left:20px;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;background:#0b1525db;color:#d4e9e3;font:12px system-ui}button,select,input{accent-color:#92dfaf}button,select{background:#173328;color:#dcf5e6;border:1px solid #36584b;border-radius:5px;padding:4px 8px}output{min-width:65px;font-variant-numeric:tabular-nums}</style></head>
<body><canvas aria-label="Северное сияние"></canvas><aside><button id="pause">Пауза</button><label>Свет <input id="active" type="checkbox"></label><label>Время <input id="time" type="range" min="0" max="180" value="12" step=".1"></label><select id="quality" aria-label="Качество"><option value="high">Высокое</option><option value="balanced">Среднее</option><option value="low">Экономное</option></select><output></output></aside><script type="module" src="/src/auroraLab.ts"></script></body></html>
