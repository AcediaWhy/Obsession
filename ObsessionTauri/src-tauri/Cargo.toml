[package]
name = "obsession"
version = "1.1.0"
description = "Obsession — DPI bypass launcher"
authors = ["VlarpSu"]
edition = "2021"

[lib]
name = "obsession_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "net", "sync"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
regex = "1"
rand = "0.8"
chrono = "0.4"
sha2 = "0.10"
# Перечисление сетевых адаптеров: выбрать LAN-адрес для QR телефона, отсекая
# VPN/виртуальные интерфейсы (см. util::lan_ip_for_phone).
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
obsession-runtime-client = { path = "../runtime-client" }
obsession-runtime-protocol = { path = "../runtime-protocol" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM-доступ к контроллеру WebView2 для MemoryUsageTargetLevel. Версии обязаны
# совпадать с теми, что тянет tauri/wry (иначе тип controller() не сойдётся):
# tauri 2.11 → webview2-com 0.38 (собран на windows 0.61 / windows-core 0.61).
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
