[package]
name = "obsession-tg-proxy"
version = "0.1.0"
edition = "2021"
description = "Obsession Telegram proxy: a headless MTProto-to-WebSocket bridge derived from Flowseal's tg-ws-proxy"
license = "MIT"
authors = ["Flowseal contributors", "Obsession contributors"]
readme = "README.md"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
base64 = "0.22"
socket2 = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
